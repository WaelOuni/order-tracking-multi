# Laboratoire local : Mongo/Kafka n'exposent que l'interface loopback de l'hôte.
# Un nœud par service permet d'apprendre, sans offrir de haute disponibilité.
name: reactive-orders-lab

services:
  mongo:
    # Version patch existante, commune au développement et aux tests d'intégration.
    image: mongo:8.0.26
    hostname: mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/replica-set.js:/opt/mongo/replica-set.js:ro
    # Un ping ne suffit pas : les transactions exigent un primary du replica set.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "127.0.0.1", "--file", "/opt/mongo/replica-set.js"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    stop_grace_period: 30s

  kafka:
    # Image officielle Apache ; KRaft évite un service ZooKeeper supplémentaire.
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # Identifiant stable du cluster pédagogique, sans caractère secret.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      # Le broker renvoie ces adresses au client : elles doivent être joignables
      # depuis LE réseau du client. localhost dans app désignerait app elle-même.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      # Spring Kafka crée les topics déclarés : une faute de frappe ne crée pas
      # silencieusement un nouveau topic côté broker.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    stop_grace_period: 30s

  catalog:
    # API HTTP de référence contrôlable pour apprendre WebClient et les pannes.
    image: wiremock/wiremock:3.13.2
    ports:
      - "127.0.0.1:${CATALOG_PORT:-8089}:8080"
    volumes:
      - ./infra/catalog/mappings:/home/wiremock/mappings:ro
    # L'image possède déjà sa commande HEALTHCHECK sur /__admin/health.
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  app:
    image: reactive-orders-lab:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_MONGODB_URI: mongodb://mongo:27017/reactive_orders?replicaSet=rs0&retryWrites=true&w=majority&serverSelectionTimeoutMS=3000
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_CATALOG_BASE_URL: http://catalog:8080
      APP_OUTBOX_ENABLED: "true"
      APP_KAFKA_LISTENER_ENABLED: "true"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalog:
        condition: service_healthy
    # /tmp reste accessible à la JVM, le reste du système de fichiers est figé.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

volumes:
  mongo-data:
  kafka-data:
